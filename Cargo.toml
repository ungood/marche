[package]
name = "marche"
# The git tags hold the real version. See build.rs.
version = "0.0.0-development"
edition = "2024"
rust-version = "1.88"
description = "A durable workflow engine that runs Open Workflow Specification definitions on Temporal"
license = "MIT"
repository = "https://github.com/ungood/marche"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
futures = "0.3"
jaq-core = "3.1"
jaq-json = "2.0"
jaq-std = "3.0"
jiff = "0.2"
jsonschema = "0.59"
libc = "0.2"
miette = { version = "7.6", features = ["fancy"] }
saphyr-parser = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.11"
temporalio-client = "1.1"
temporalio-common = "1.1"
temporalio-macros = "1.1"
temporalio-sdk = { version = "1.1", default-features = false, features = ["envconfig"] }
temporalio-workflow = "1.1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
ulid = "3"

[dev-dependencies]
cucumber = "0.23"
jsonschema = "0.59"
libc = "0.2"
serde_json = "1"
serde_yaml_ng = "0.10.0"
shell-words = "1"
strip-ansi-escapes = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "cucumber"
harness = false
