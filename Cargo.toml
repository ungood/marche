[package]
name = "marche"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A durable workflow engine that runs Open Workflow Specification definitions on Temporal"
license = "MIT"
repository = "https://github.com/ungood/marche"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
jaq-core = "3.1"
jaq-json = "2.0"
jaq-std = "3.0"
jsonschema = "0.59"
miette = { version = "7.6", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.11"
temporalio-client = "1.1"
temporalio-sdk = { version = "1.1", default-features = false, features = ["envconfig"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
ulid = "3"

[dev-dependencies]
cucumber = "0.23"
jsonschema = "0.59"
serde_json = "1"
serde_yaml_ng = "0.10.0"
strip-ansi-escapes = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "cucumber"
harness = false
