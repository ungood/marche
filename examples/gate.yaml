document:
  dsl: '1.0.4'
  namespace: examples
  name: gate
  version: '0.1.0'
do:
  - openPullRequest:
      run:
        shell:
          command: gh pr create --draft --fill
  - waitForApproval:
      try:
        - checkApproval:
            run:
              shell:
                command: test "$(gh pr view --json reviewDecision --jq .reviewDecision)" = APPROVED
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
        retry:
          delay:
            minutes: 5
          limit:
            duration:
              hours: 24
  - merge:
      run:
        shell:
          command: gh pr merge --squash
