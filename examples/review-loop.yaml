document:
  dsl: '1.0.4'
  namespace: examples
  name: review-loop
  version: '0.1.0'
do:
  - start:
      set:
        attempt: 0
  - review:
      run:
        shell:
          command: ./review.sh
        return: code
      output:
        as: '${ { attempt: ($input.attempt + 1), passed: (. == 0) } }'
  - decide:
      switch:
        - passed:
            when: .passed
            then: end
        - tooMany:
            when: .attempt >= 3
            then: giveUp
        - again:
            then: fix
  - fix:
      run:
        shell:
          command: ./fix.sh
      output:
        as: ${ $input }
      then: review
  - giveUp:
      raise:
        error:
          type: https://example.com/errors/review-failed
          status: 422
          title: Review still failing after three attempts
